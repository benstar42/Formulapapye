<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulaire de Naturalisation</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    padding:20px;
}
.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}
h1{
    text-align:center;
}
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
}
button{
    margin-top:20px;
    padding:12px 20px;
    cursor:pointer;
}
#pdfContent{
    padding:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>Demande de Naturalisation</h1>

<div id="formulaire">

<label>Nom complet</label>
<input type="text" id="nom">

<label>Date de naissance</label>
<input type="date" id="dateNaissance">

<label>Lieu de naissance</label>
<input type="text" id="lieuNaissance">

<label>Sexe</label>
<select id="sexe">
<option>Homme</option>
<option>Femme</option>
</select>

<label>Nationalité actuelle</label>
<input type="text" id="nationalite">

<label>Adresse actuelle</label>
<input type="text" id="adresse">

<label>Téléphone</label>
<input type="text" id="telephone">

<label>Email</label>
<input type="email" id="email">

<label>État civil</label>
<select id="etatCivil">
<option>Célibataire</option>
<option>Marié(e)</option>
<option>Divorcé(e)</option>
<option>Veuf(ve)</option>
</select>

<label>Nom du conjoint</label>
<input type="text" id="conjoint">

<label>Nom du père</label>
<input type="text" id="pere">

<label>Nom de la mère</label>
<input type="text" id="mere">

<label>Numéro de passeport</label>
<input type="text" id="passeport">

<label>Date d'expiration du passeport</label>
<input type="date" id="expiration">

<label>Date d'entrée dans le pays</label>
<input type="date" id="entree">

<label>Type de visa ou résidence</label>
<input type="text" id="visa">

<label>Nombre d'années de résidence</label>
<input type="number" id="annees">

<label>Profession</label>
<input type="text" id="profession">

<label>Employeur</label>
<input type="text" id="employeur">

<label>Niveau d'études</label>
<input type="text" id="etudes">

<label>Avez-vous un casier judiciaire ?</label>
<select id="casier">
<option>Non</option>
<option>Oui</option>
</select>

<label>Langues parlées</label>
<input type="text" id="langues">

<label>Motif de la naturalisation</label>
<textarea id="motif"></textarea>

<button onclick="genererPDF()">Télécharger PDF</button>

</div>

</div>

<script>

function genererPDF(){

const contenu = `
<div id="pdfContent">
<h1>Demande de Naturalisation</h1>

<p><b>Nom:</b> ${nom.value}</p>
<p><b>Date de naissance:</b> ${dateNaissance.value}</p>
<p><b>Lieu de naissance:</b> ${lieuNaissance.value}</p>
<p><b>Sexe:</b> ${sexe.value}</p>
<p><b>Nationalité:</b> ${nationalite.value}</p>
<p><b>Adresse:</b> ${adresse.value}</p>
<p><b>Téléphone:</b> ${telephone.value}</p>
<p><b>Email:</b> ${email.value}</p>
<p><b>État civil:</b> ${etatCivil.value}</p>
<p><b>Conjoint:</b> ${conjoint.value}</p>
<p><b>Père:</b> ${pere.value}</p>
<p><b>Mère:</b> ${mere.value}</p>
<p><b>Passeport:</b> ${passeport.value}</p>
<p><b>Expiration:</b> ${expiration.value}</p>
<p><b>Date d'entrée:</b> ${entree.value}</p>
<p><b>Visa/Résidence:</b> ${visa.value}</p>
<p><b>Années de résidence:</b> ${annees.value}</p>
<p><b>Profession:</b> ${profession.value}</p>
<p><b>Employeur:</b> ${employeur.value}</p>
<p><b>Études:</b> ${etudes.value}</p>
<p><b>Casier judiciaire:</b> ${casier.value}</p>
<p><b>Langues:</b> ${langues.value}</p>
<p><b>Motif:</b> ${motif.value}</p>

<br><br>
<p>Signature: ________________________</p>

</div>
`;

const element = document.createElement("div");
element.innerHTML = contenu;

html2pdf()
.set({
margin:10,
filename:'Demande_Naturalisation.pdf',
image:{type:'jpeg',quality:1},
html2canvas:{scale:2},
jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
})
.from(element)
.save();

}

</script>

</body>
</html>
