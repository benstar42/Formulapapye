<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche d'Inscription - Carte de Résidence</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* --- ESTIL POU L PARÈT TANKOU FEÝ PAPYE --- */
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #d1d8e0; /* Fond dèyè a parèt tankou yon tab */
            margin: 0;
            padding: 40px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: #000;
        }

        /* Fèy papye blan an */
        .paper-sheet {
            background-color: #ffffff;
            width: 800px;
            min-height: 1000px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid #ccc;
            box-sizing: border-box;
            position: relative;
        }

        /* Tèt fèy papye a */
        .paper-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px double #000;
            padding-bottom: 20px;
        }

        .paper-header h1 {
            font-size: 22px;
            text-transform: uppercase;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        .paper-header h2 {
            font-size: 16px;
            text-transform: uppercase;
            margin: 0;
            color: #333;
            font-weight: normal;
        }

        .instruction-text {
            font-style: italic;
            font-size: 14px;
            margin-bottom: 30px;
            color: #444;
            border-left: 3px solid #000;
            padding-left: 10px;
        }

        /* --- FÒMILÈ SOU PAPYE A --- */
        .form-title {
            font-size: 16px;
            text-transform: uppercase;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .field-box {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .field-box label {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        /* Liy fòmilè yo parèt tankou kote y ap ekri ak plim */
        .field-box input, .field-box select {
            border: none;
            border-bottom: 1px solid #000;
            padding: 8px 5px;
            font-size: 16px;
            font-family: 'Times New Roman', Times, serif;
            outline: none;
            background: transparent;
        }

        .field-box input:focus {
            border-bottom: 2px solid #000;
            background-color: #fafafa;
        }

        /* --- APÈSÌ KAT LA SOU PAPYE A --- */
        .preview-section {
            margin-top: 5px;
            border-top: 2px dashed #000;
            padding-top: 40px;
        }

        .preview-title {
            font-size: 14px;
            font-style: italic;
            color: #555;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Pou nou ka kache bwat sa a nan PDF la nèt */
        #pdf-area {
            width: 500px;
            margin: 0 auto;
            padding: 10px;
            background: #fff;
        }

        .residence-card {
            width: 500px;
            height: 300px;
            background: linear-gradient(135deg, #ffffff 0%, #e3e9ed 100%);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            border: 2px solid #2c3e50;
            color: #1e272e;
        }
