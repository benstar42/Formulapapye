<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eroblack Fòmasyon</title>

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
}

h1{
    text-align:center;
}

label{
    font-weight:bold;
    display:block;
    margin-top:10px;
}

input,select,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
}

button{
    margin-top:20px;
    padding:12px;
    width:100%;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>FÒMILÈ EROBLACK FONDASYON</h1>

<label>Non konplè</label>
<input type="text" id="nom">

<label>Telefòn</label>
<input type="text" id="telephone">

<label>Email</label>
<input type="email" id="email">

<label>Motivasyon</label>
<textarea id="motif"></textarea>

<!-- Wi/Non kesyon -->
<label>Eske ou vle patisipe?</label>
<select id="q1">
<option>Wi</option>
<option>Non</option>
</select>

<label>Eske ou respekte règ yo?</label>
<select id="q2">
<option>Wi</option>
<option>Non</option>
</select>

<label>Eske ou dakò ede òganizasyon an?</label>
<select id="q3">
<option>Wi</option>
<option>Non</option>
</select>

<!-- BUTTON -->
<button onclick="sendToAndroid()">
Kreye PDF
</button>

</div>

<script>

function sendToAndroid(){

    Android.sendData(
        document.getElementById("nom").value,
        document.getElementById("telephone").value,
        document.getElementById("email").value,
        document.getElementById("motif").value,
        document.getElementById("q1").value,
        document.getElementById("q2").value,
        document.getElementById("q3").value
    );

}

</script>

</body>
</html>
