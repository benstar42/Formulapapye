<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FÒMILÈ EROBLACK</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>FÒMILÈ EROBLACK</h2>

<input id="nom" placeholder="Non konplè">
<input id="telephone" placeholder="Telefòn">
<input id="email" placeholder="Email">

<textarea id="motif" placeholder="Motivasyon"></textarea>

<select id="q1">
<option>Wi</option>
<option>Non</option>
</select>

<select id="q2">
<option>Wi</option>
<option>Non</option>
</select>

<button onclick="generatePDF()">
Telechaje PDF
</button>

</div>

<script>

function generatePDF(){

const element = document.createElement("div");

element.innerHTML = `
<h1>FÒMILÈ EROBLACK</h1>
<p><b>Non:</b> ${document.getElementById("nom").value}</p>
<p><b>Tel:</b> ${document.getElementById("telephone").value}</p>
<p><b>Email:</b> ${document.getElementById("email").value}</p>
<p><b>Motif:</b> ${document.getElementById("motif").value}</p>
<p><b>Q1:</b> ${document.getElementById("q1").value}</p>
<p><b>Q2:</b> ${document.getElementById("q2").value}</p>
`;

html2pdf()
.set({
    margin:10,
    filename:'Eroblack_Form.pdf',
    image:{type:'jpeg',quality:1},
    html2canvas:{scale:2},
    jsPDF:{unit:'mm',format:'a4'}
})
.from(element)
.outputPdf('blob')   // 🔥 SA se kle a
.then(function(pdfBlob){

    let url = URL.createObjectURL(pdfBlob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "Eroblack_Form.pdf";

    document.body.appendChild(a);
    a.click();

    document.body.removeChild(a);

});

}

</script>

</body>
</html>
